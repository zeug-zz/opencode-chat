name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 10.16.0

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm run build

      - name: Lint & Format check
        run: pnpm check

      - name: Check sandbox dependency compatibility
        run: pnpm --filter @opencode-chat/agent-opencode exec vitest run src/__tests__/sandbox-dependency-compatibility.test.ts

      - name: Check release dependency compatibility
        run: node packages/platforms/vscode/scripts/test-release-dependency-compatibility.mjs

      - name: Check Mermaid KaTeX compatibility
        run: node scripts/test-mermaid-katex-compatibility.mjs

      - name: Test
        run: pnpm test:all
