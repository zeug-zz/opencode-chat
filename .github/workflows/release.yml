name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 10.16.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test:all

      - name: Copy root files for extension packaging
        run: cp LICENSE CHANGELOG.md THIRD_PARTY_NOTICES.md packages/platforms/vscode/

      - name: Package extension
        run: pnpm --filter opencode-scribe run package
        working-directory: .

      - name: Verify packaged extension
        run: pnpm --filter opencode-scribe run verify-package

      - name: Resolve packaged VSIX
        id: package
        run: |
          artifact_path="$(node -e 'const manifest = require("./packages/platforms/vscode/package.json"); if (manifest.name !== "opencode-scribe" || typeof manifest.version !== "string" || !/^[0-9A-Za-z.+-]+$/.test(manifest.version)) process.exit(1); process.stdout.write(`packages/platforms/vscode/${manifest.name}-${manifest.version}.vsix`);')"
          test -f "$artifact_path"
          printf 'path=%s\n' "$artifact_path" >> "$GITHUB_OUTPUT"

      - name: Upload .vsix to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: ${{ steps.package.outputs.path }}
